name: Sync Instagram feeds

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-instagram-feeds
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install feed sync dependency
        run: npm ci

      - name: Refresh public Instagram feeds
        run: node scripts/sync-instagram-feeds.mjs

      - name: Publish feed changes
        run: |
          if git diff --quiet -- data/behind-scenes.json js/behind-scenes-snapshot.js assets/images/instagram-premierpadel-*.jpg assets/images/instagram-ohpadel-club-*.jpg; then
            echo "No Instagram feed changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/behind-scenes.json js/behind-scenes-snapshot.js assets/images/instagram-premierpadel-*.jpg assets/images/instagram-ohpadel-club-*.jpg
          git commit -m "chore: sync Instagram feeds"

          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
