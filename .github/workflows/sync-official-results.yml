name: Sync official tournament results

on:
  schedule:
    # Keep the native five-minute trigger and also poll inside the job. If
    # GitHub delays or coalesces a scheduled event, the active job keeps going.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-official-tournament-results
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check tournament window
        id: tournament
        env:
          TZ: Africa/Johannesburg
        run: |
          today="$(date +%F)"
          if [[ "$today" < "2026-07-26" || "$today" > "2026-08-02" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Tournament sync is inactive on $today."
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.tournament.outputs.active == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.tournament.outputs.active == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Poll and publish official results
        if: steps.tournament.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for iteration in $(seq 1 70); do
            cycle_started="$(date +%s)"
            echo "Official result check $iteration at $(date --iso-8601=seconds)"

            if ! git pull --rebase origin main; then
              echo "::warning::Could not update the working copy; retrying next cycle."
              git rebase --abort || true
            elif ! node scripts/sync-official-results.mjs; then
              echo "::warning::Official result fetch failed; retrying next cycle."
              git restore --source=HEAD -- data/official-results.json js/official-results-snapshot.js
            else
              if git diff --quiet -- data/official-results.json js/official-results-snapshot.js; then
                echo "No result changes to publish."
              else
                git add data/official-results.json js/official-results-snapshot.js
                git commit -m "chore: sync official tournament results"
              fi

              if ! git push origin HEAD:main; then
                echo "::warning::Could not publish this cycle; retrying next cycle."
              fi
            fi

            if [ "$iteration" -eq 70 ]; then
              break
            fi

            elapsed=$(($(date +%s) - cycle_started))
            wait_seconds=$((300 - elapsed))
            if [ "$wait_seconds" -gt 0 ]; then
              sleep "$wait_seconds"
            fi
          done
